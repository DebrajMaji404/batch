spring.application.name=batch
eazy.batch.enabled=true
eazy.batch.thread-pool-size=5
eazy.batch.queue-capacity=100
eazy.batch.default-chunk-size=100
eazy.batch.default-skip-limit=10
# eazy.batch.export.local-directory=/var/exports

# Spring Batch Configuration
spring.batch.job.enabled=false
# NOTE: left as 'never' on purpose - BatchProcessorAutoConfiguration's
# initializeBatchTables CommandLineRunner already checks for existing tables
# and creates them from schema-postgresql.sql. Leaving this as 'always' makes
# Spring Boot's own (non-idempotent) batch schema initializer run on every
# startup too, which fails with "relation already exists" after the first run.
spring.batch.jdbc.initialize-schema=never
spring.batch.jdbc.isolation-level-for-create=READ_COMMITTED
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
spring.batch.jdbc.table-prefix=BATCH_